# Containment for the secretary-api memory runaway (P160, 2026-09-15/16 evidence).
#
# The unit declared no memory limit, so a runaway reached ~20 GB and the kernel's
# GLOBAL oom killer picked the victim: 8 kills on 2026-09-15 and 23 more on
# 2026-09-16, every one `constraint=CONSTRAINT_NONE ... global_oom`, plus a SIGBUS
# at 14:35 on 09-16. A cgroup limit makes the failure local and observable, and the
# cgroup kill fires inside the unit instead of harvesting box-wide memory.
#
# Values: the app's healthy warm footprint measured 1.8-3.6 GB (2026-09-15 soak),
# the runaway goes to 20+ GB. MemoryHigh throttles/reclaims at 5 GB; MemoryMax kills
# at 8 GB, leaving the 23 GB host ~15 GB of headroom. MemorySwapMax stops the unit
# from thrashing the host's 4 GB of swap. Reversible: delete this file and
# `systemctl daemon-reload` (no service restart needed to apply or remove).
[Service]
MemoryAccounting=yes
MemoryHigh=5G
MemoryMax=8G
MemorySwapMax=1G
