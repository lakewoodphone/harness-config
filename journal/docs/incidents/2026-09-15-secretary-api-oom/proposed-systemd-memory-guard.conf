# Containment for the secretary-api memory runaway (2026-09-15 evidence).
#
# Install (requires a service restart -- NOT done by this report):
#   sudo install -d /etc/systemd/system/secretary-api.service.d
#   sudo install -m 0644 api-oom-systemd-memory-guard.conf \
#        /etc/systemd/system/secretary-api.service.d/20-memory-guard.conf
#   sudo systemctl daemon-reload
#
# Why: the unit declares no memory limit at all, so a runaway reaches ~20 GB and
# the kernel's GLOBAL oom killer picks the victim. On 2026-09-15 that happened
# six times, and each time the unit's own log shows `global_oom` with
# `constraint=CONSTRAINT_NONE` -- i.e. the box, not the service, was the thing
# being protected, and the API died by SIGKILL with no chance to drain.
# A cgroup limit makes the failure local, predictable and observable.
#
# These values are chosen to leave the 23 GB host ~16 GB of headroom while
# comfortably exceeding the app's healthy warm footprint (~0.9 GB).
[Service]
MemoryAccounting=yes
MemoryHigh=3G
MemoryMax=6G
MemorySwapMax=1G
# A memory-limit kill is a service failure, not a host emergency: restart it.
Restart=always
RestartSec=5
OOMPolicy=continue
