# LakewooechsMini -- the office Mac mini, Yocheved's manager workstation.
#
# This file is merged OVER `settings/base.yaml` by `scripts/sync.py` (machine wins).
#
# ---------------------------------------------------------------------------
# SANDBOX: full access, deliberately. REVERSED 2026-09-15 on the owner's instruction.
#
# This file previously overrode `base.yaml` down to `workspace-write`, on an earlier reading of the
# owner's requirement. He has since stated the boundary explicitly and the override is now WRONG:
#
#   "remember to err on the side of giving her system more power and access to the system, not
#    less, she is to be the full manager for lpt / just make sure things that come from her
#    machine get documented as such / her agent should have access to our logs systems and
#    sessions and chat history and more, we don't want to cripple her agent"
#
#   "make her agent similar to ours, very powerful and self learning and all, don't cripple it,
#    just make sure the edits from her machine are labeled and marked, but don't restrict her agent"
#
# So the boundary for her machine is VISIBILITY, NOT PERMISSION. She runs the shop; an assistant that
# cannot write where the work is cannot manage it. What replaces the sandbox restriction is
# ATTRIBUTION, and it is structural rather than a convention:
#   * every git commit made on this box carries `Dsh-Actor` / `Dsh-Machine: LAKEWOOECHSMINI`
#     trailers, written by the prepare-commit-msg hook installed from this repo;
#   * every session row that reaches the authority is keyed on `source_machine`, this box's own
#     hostname, inside a PRIMARY KEY -- her work and the owner's cannot be confused by accident.
#
# Do not narrow this again without a fresh instruction from the owner, in his words, recorded here.
# ---------------------------------------------------------------------------
permission:
  defaultPreset: danger-full-access

# ---------------------------------------------------------------------------
# Model route: DeepSeek DIRECT.
#
# No proxy and no Worker on this machine. The office network has no content filter, so
# `api.deepseek.com` is reachable as itself -- verified from this host before wiring it. The proxy
# that her laptop needs exists only because Techloq blocks the direct endpoint by URL category there;
# carrying that machinery here would add a dependency for no benefit.
#
# Direct is also the fast route, which is the whole point: measured 2026-09-14 from a neutral
# network, same prompt, max_tokens=200, three runs each --
#     deepseek-flash direct   :  747 ms to first token, 160 tok/s
#     DeepInfra V4-Flash-0731 : 1693 ms to first token,  24 tok/s
# So this machine gets the better tier natively, with nothing in the path to keep alive.
#
# The `deepinfra` route is retained as an independent fallback, selectable with one
# `agent-default-model.provider` line if DeepSeek itself is ever unavailable.
# ---------------------------------------------------------------------------
agent-default-model:
  provider: deepseek-direct
  # VISION, AND WHY THROUGH THE pi-ai ROUTE RATHER THAN `deepseek-official`.
  #
  # Two blocks stood between this machine and images, and only the second is obvious:
  #   1. pi-ai's catalog declares exactly one DeepSeek model that accepts images
  #      (deepseek-v4-flash-vision-exp, input text+image); `deepseek-flash` and `deepseek-v4-pro` are
  #      text-only. Attaching an image to a text-only model returns HTTP 200 with an EMPTY reply --
  #      no error, which reads as a broken app.
  #   2. the `dsh-llm-deepseek` adapter hard-rejects image content by design
  #      ("does not support image content", UNSUPPORTED), which is what `deepseek-official` uses.
  # So the default is the pi-ai `deepseek-direct` route on the vision model: images work, and the
  # request still goes straight to api.deepseek.com with no proxy involved.
  model: deepseek-v4-flash-vision-exp

# Her assistant is the shop manager, so a fresh session mounts the `yocheved` preset
# (presets/yocheved/). Derived from cordis-bg, so the background-first shell policy is retained.
agent-presets:
  default: yocheved

ui-conversation:
  busyEnter: steer

llm-pi-ai:
  providers:
    # DIRECT DeepSeek, no proxy -- this machine has no content filter, so the pass-through Worker that
    # her laptop needs would add a hop for nothing. Kept as a selectable route so the model picker can
    # offer the vision model and the text-only ones side by side.
    deepseek-direct:
      apiKeyEnv: DEEPSEEK_API_KEY
      api: openai-completions
      baseURL: https://api.deepseek.com/v1
      # See the note on the laptop's config: a `models` list REPLACES pi-ai's installed catalog, so the
      # route itself must declare what it accepts or the adapter falls back to ["text"] and refuses an
      # attachment. Measured: deepseek-flash reads images at the same speed as text, so there is no
      # trade-off here, and only deepseek-v4-pro is genuinely image-blind.
      defaultInput: [text, image]
      models:
        # NO `input:` DECLARATIONS -- measured rather than assumed, and my first attempt was wrong.
        # Declaring `input: [text]` makes the pi-ai adapter REFUSE an attachment, so it creates the
        # limitation it claims to describe. Measured here: deepseek-flash reads images in about the same
        # time as text (direct: TEXT 433ms/84tok/s vs IMAGE 381ms/91tok/s), so there is no trade-off to
        # make and no "faster text model". Only deepseek-v4-pro is genuinely image-blind (0/3).
        # pi-ai's shipped catalog under-declares deepseek-flash; the model itself is fine.
        - id: deepseek-v4-flash-vision-exp
          name: DeepSeek Flash Vision (images)
        - id: deepseek-flash
          name: DeepSeek Flash (images)
        - id: deepseek-v4-pro
          name: DeepSeek V4 Pro (text only)
    # Not used as the default; present so switching is a one-line change and so the model picker
    # offers an independent provider.
    deepinfra:
      apiKeyEnv: DEEPINFRA_API_KEY
      api: openai-completions
      baseURL: https://api.deepinfra.com/v1/openai
      models:
        - id: deepseek-ai/DeepSeek-V4-Flash-0731
          name: DeepSeek V4 Flash (0731, DeepInfra)
        - id: deepseek-ai/DeepSeek-V4.1-Flash
          name: DeepSeek V4.1 Flash (DeepInfra)
        - id: deepseek-ai/DeepSeek-V3.2
          name: DeepSeek V3.2 (DeepInfra)

# ---------------------------------------------------------------------------
# PARITY WITH THE OWNER'S OWN MACHINE (added 2026-09-15).
#
# Measured gap before this change, by diffing her merged settings against his: her file pinned
# `workspace-write` (now fixed above) and was missing this block entirely. `maxParallelToolCalls`
# is how the owner's sessions run many independent tool calls at once, which is most of the
# difference between an assistant that answers and one that works. There was no reason for her
# assistant to have less of it.
# ---------------------------------------------------------------------------
agent-loop:
  maxParallelToolCalls: 20
