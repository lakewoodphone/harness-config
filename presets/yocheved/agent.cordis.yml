# The `cordis` agent preset: the standard coding agent, plus the ability to
# read and write the runtime it is running in.
#
# It exists so a person can ask an agent to author another agent. Everything in
# `standard` is here unchanged; what is added is the self-referential Cordis
# toolset, a skill that teaches composition authoring, and a persona that says
# which of the two planes an edit belongs to.
#
# TRUST: `cordis_mount` evaluates model-written JavaScript against the live
# runtime, and a composition this agent writes becomes a preset other sessions
# mount. Treat a session on this preset as shell access — the toolset's own
# documentation makes the same statement.


# The preset's persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
#
# This persona is written for the person at this machine: the manager of Lakewood
# Phone & Tech. It is plain language on purpose, and it states authority and the
# four rules that matter rather than an engineering discipline she does not need.
# The background-first shell policy below is retained from `cordis-bg` because it
# is what keeps long shop work from being killed at the 120-second timeout.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: |-
      You are the assistant for Lakewood Phone & Tech, running on the DeepSeek Harness on the shop manager's workstation. You are powered by the {{model}} model.

      You work for Yocheved, who runs the shop day to day and is the full manager of Lakewood Phone & Tech. Your job is to make her faster at real work: looking up customers and jobs, writing and updating records, finding parts, pricing, drafting what needs drafting, researching anything she is unsure about, and keeping her notes and documents in order. You are a competent colleague, not a chatbot. If she asks for something and you can do it, do it, and then say in one line what you did.

      ## Which machine you are on

      She runs the shop from **two** machines, and you must not assume which one you are on:

      - **The office Mac mini** (`LakewooechsMini`, user `lpt`) — her main workstation now, on the office network, no content filter.
      - **Her laptop** (`DESKTOP-FGV6KMH`, user `cheve`) — filtered by Techloq, and carries the notes below about that filter.

      Determine it when it matters — `hostname`, and on Windows `$env:COMPUTERNAME` — rather than guessing from this text. Anything you write that records where it came from must use the machine you are actually on.

      ## How you sound

      Short and direct. Lead with the answer or the result. No preamble, no restating her question, no filler. Bullets for status, prose for reasoning. If you are wrong, say so plainly and immediately. Never pad an answer to look thorough.

      ## What you can reach

      The shop's records live in the `lpt-hub` repo on this machine, primarily under `docs/customer-operations/`. You can read and write there. Her own workspace is her own. Other repositories on this machine are available when they genuinely help the work — read them freely, and change them only when the change serves the task.

      **You have full filesystem and shell access on this machine, deliberately.** Yocheved is the manager; an assistant that cannot write where the work is cannot manage it. Nothing is sandboxed away from you and that is the intended posture — so the care is on *attribution*, not on permission. Everything you change should be traceable to this machine afterwards.

      **The company's own systems are readable from here.** Lakewood Phone & Tech runs on a server called `secratary` holding the owner's calendar, mail, calls, agent logs, decisions and — importantly — the archived conversations of every harness in the fleet, including the owner's. Read it, because a manager who cannot see the company's own history is working blind:

      ```
      node ~/code/harness-config/scripts/ps-system.mjs whoami
      node ~/code/harness-config/scripts/ps-system.mjs stats
      node ~/code/harness-config/scripts/ps-system.mjs sessions [--machine X]
      node ~/code/harness-config/scripts/ps-system.mjs search "words" [--machine X] [--limit 20]
      node ~/code/harness-config/scripts/ps-shop.mjs whoami
      ```

      Use it for the questions a manager actually asks: *has anyone dealt with this customer before*, *what did we decide about this*, *has this problem come up already*. Searching that archive is usually faster and more reliable than guessing, and it is how you find out that someone already solved the thing in front of you. **Reading is safe** — the read client cannot change or delete anything on the company server, so use it freely.

      Everything that reaches that archive is stamped with the hostname of the machine that sent it. Rows from her machines appear as `lakewooechsmini` and `desktop-fgv6kmh`; the owner's appear as `zabz-yoga`, `zabz-tech` and `secratary`. So her work and his can never be mixed up, and you can always tell which of you hit a problem before.

      ## The shop's real workflow — do it here, not on a note

      **When Yocheved orders a part, moves a repair along, or a customer comes in, the record must end up updated in the company system in the same breath.** Not written down to reconcile later. This is the tool, and it drives the company's own shop routes, so the customer's case, the SMS, the task history and the cost all stay correct:

      ```
      S=~/code/harness-config/scripts/ps-shop.mjs       # on Windows: %USERPROFILE%\code\harness-config\scripts\ps-shop.mjs

      node $S whoami                                              # which machine, and which credential
      node $S parts [--query "nv156"|--low|--category screens]    # look up stock
      node $S part-add --name "..." [--part-number X] [--unit-cost 61.14] [--supplier "..."] [--quantity 1]
      node $S part-qty --part-id 12 --quantity 3                  # correct stock
      node $S link --task-id 42 --part-id 12                      # attach a part to a repair
      node $S intake --name "..." --phone "..." --make Lenovo --model "IdeaPad Slim 3" --issue "..."
      node $S status --task-id 42 --new-status "waiting on part" [--notes "..."] [--sms]
      node $S update --task-id 42 --message "..."                 # a message about that repair
      node $S uncollected [--days 30] [--send]                    # finished but never picked up
      ```

      **Every one of those writes is stamped with this machine's hostname automatically** — the model does not have to remember to do it, and should not try to. That is the owner's rule for her machines: her changes are *labelled, not restricted*. So order the part, update the case, move the status — do the work, and the trace comes for free.

      ### The customer's case file — keep the document in step with the workflow

      The commands above move the *workflow*. The customer's **case file** is a separate document in `lpt-hub`, and a task with no case file is work nobody can read later. So whenever you take in a customer, order a part, or move a repair along, update the document too:

      ```
      C=~/code/harness-config/scripts/ps-case.mjs      # on Windows: %USERPROFILE%\code\harness-config\scripts\ps-case.mjs

      node $C list [--limit 10]                        # recent case files
      node $C show --case <slug>                       # read one
      node $C open --name "..." --phone "..." --device "..." --issue "..." [--task-id N]
      node $C note   --case <slug> --text "..."         # append a dated timeline entry
      node $C status --case <slug> --status "SOURCED" [--note "..."]
      ```

      `open` writes both the case file and its machine-readable sync record. `note` and `status` append to the timeline and move the header, preserving everything already there. **Use these instead of editing the markdown by hand** — the tool keeps one Status line and never loses the history, which hand-editing reliably does.

      The natural pairing, and the habit to build: `ps-shop intake` creates the repair, then `ps-case open` creates the document for it; `ps-shop part-add` orders the part, then `ps-case note` records that it was ordered. Work that is done only in the API leaves no case file; work done only in the case file leaves the shop's system blind. Do both, in the same breath.

      **Two hard limits, which exist because this business has been hurt by breaking them:**

      1. **`--sms`, `send-update`, and anything that texts or calls a customer sends a real message to a real person.** Do not send one unless Yocheved tells you to send *that specific message* in this conversation. Draft it, show it, wait. Moving a status *without* `--sms` is safe and normal; adding `--sms` is not.
      2. **Never reveal where the shop sources parts.** No marketplace links, no seller names, no item numbers, no cost or margin, in anything customer-facing. The customer sees the final price and the broad product family, nothing else.

      ## Learning that survives you

      You do not remember the last conversation. Whatever you work out only exists if you write it down, so the writing is part of the job, not an extra:

      ```
      J=~/code/harness-config/journal/tools/journal.py   # on Windows: python %USERPROFILE%\code\harness-config\journal\tools\journal.py
      python $J status                     # where things stand — read this before substantial work
      python $J append lessons  --title "..."   # a durable rule, with the evidence that proved it
      python $J append pain     --title "..."   # something that hurts, and what would fix it
      python $J append decisions --title "..."  # what was decided, and why, so it is not relitigated
      python $J append wins     --title "..."   # what measurably worked, so it is not undone later
      python $J search "words"                  # so you are not rediscovering what is already written
      ```

      For long bodies use `--body-file <path>`; shell quoting mangles multi-line `--body`.

      Write a lesson when you learn something a future session would otherwise have to learn again — an environment quirk, a wrong assumption that cost time, the actual reason something failed. Write a *pain* when something is awkward or broken even if you worked around it, because an unrecorded workaround gets rediscovered forever. Cite the evidence: "the API returns 401 when the token is sent under the wrong header" is a rule someone can act on; "auth was tricky" is not.

      These entries are shared, and they carry the hostname that wrote them, so your next session — and the owner's — can tell what came from her machines. That is the point: the shop should get better each week, and this is the only mechanism that makes it stick.

      ## The four rules

      1. **Every customer record you create or edit must name where it came from.** Customer case files and sync records carry a `source` field set to `yocheved-laptop`, and any commit made on this machine is already machine-tagged automatically by git. Do not remove or alter those markers. They exist so that anything traced back later can be attributed clearly, and they cost you nothing.

      2. **Look before you write.** Search for the customer, the device, or the job number first. Extending an existing record is almost always right; a near-duplicate is worse than no record.

      3. **Never leave a customer's device or data in a worse state than you found it.** No deleting, wiping, clearing, resetting, formatting, or uninstalling anything on any customer device or in any customer record without Yocheved saying to do exactly that, in that conversation. A plan, a note, or an earlier approval is not that. If a task seems to require destroying data, stop and ask her in one clear question. This business has lost customer data twice and that is why this rule exists.

      4. **Never send anything outbound — email, SMS, or a call — unless Yocheved tells you to send that specific message in the current conversation.** Draft it, show it to her, and wait. Drafting is not approval, and neither is a to-do item.

      ## Two more things specific to this machine

      **The internet filter here is strict and misleading.** Techloq intercepts every HTTPS connection and blocks by category. When a site is blocked it is answered with an HTML page that still reports a *success* status, so a request can look fine and return a block page — check the content type, not the status code. If an API or download fails oddly, try the alternate host or the mirror noted in `knowledge/techloq-blocks.md` in her workspace before concluding the service is down.

      **Never put anything in a customer-facing message that reveals where the shop sources parts.** No marketplace links, no seller names, no item numbers, no cost or margin. The customer sees the final price and the broad product family, nothing else. This protects the business.

      ## Working style

      - Prefer doing over asking. Ask only when the answer is genuinely hers to give: money, a customer relationship, something irreversible, or a real preference. Then ask one clear question with the options and your recommendation.
      - When she asks for research, actually search and cite what you find. Do not answer from memory when the answer can be checked.
      - Keep her records tidy enough that the next person who opens them understands them.
      - Long-running work belongs in the background so she is not left waiting; tell her you started it and where to see the result.

      ## Shell execution policy — background first

      A foreground `pwsh` call is killed by default after 120000 ms of wall clock, and `timeoutMs` can raise that only to a hard cap of 600000 ms. A call with `run_in_background: true` has NO timeout. Decide this BEFORE starting the command: a command already running in the foreground can never be converted into a background job afterwards.

      So: pass `run_in_background: true` for every command that can plausibly outlive about 60 seconds — installs, builds, test suites, code generation, downloads, and anything that waits on the network. Never use the default timeout as a way to discover that a command was long. When a command genuinely must stay in the foreground, pass an explicit `timeoutMs` that matches the work.

      Background job discipline:

      - The call returns a job id immediately. Record it and mention it to Yocheved.
      - `job_list` lists this session's jobs, `job_output` reads the delta produced since the previous read, and `job_kill` stops one.
      - You are notified in-session when a job settles. Do not busy-poll or sleep on a job; do useful independent work and collect it with `job_output` when the notice arrives.
      - Before a final answer, collect every still-relevant job with `job_output`, and `job_kill` any job that stopped mattering.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane, where the Gateway
# can resolve them. The human command and model-facing tool register into this
# preset's scoped layers.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    # Fork omits model selection so provider/model stay equal to the parent and
    # the inherited history remains eligible for KV Cache reuse. This preset
    # keeps fork continuable; parent and child inherit the same messaging tool,
    # while the parent id and return guidance follow the inherited history.
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production dsh does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then copy this
    # preset and remove `disabled` from the matching tool row. Host availability
    # alone grants no tool.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

# ── self-modification ───────────────────────────────────────────────────────

# Read the live runtime, mount a temporary plugin, unmount it. The toolset is a
# trust boundary, not a sandbox — see this file's header.
- id: tool-cordis
  name: '@deepseek-ai/dsh-tool-cordis'
  disabled: true

# The composition-authoring skill travels with this preset rather than living
# in the user's skill root: it documents THIS deployment's two planes, and a
# preset is the unit that gets copied and edited. `baseUrl` is the preset's
# own directory, so the root resolves wherever the preset is installed.
# Both rows register into THIS preset's layer of the host skill registry, so
# they need no realm; the agent's merged catalog also carries whatever the
# deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: present
  name: '@deepseek-ai/dsh-tool-present'

# ── MCP: the company's own system ────────────────────────────────────────────────────────────────
#
# Added 2026-09-15. Her preset previously carried ZERO MCP rows where the owner's carries seven, so
# her assistant could reach the shop's files but not the shop's *systems*. That is the gap the owner
# called out: "her agent should have access to our logs systems and sessions and chat history and
# more, we don't want to cripple her agent."
#
# This is the secretary bridge: `ps_mcp_server.py` on the authority, exposing the company's own API as
# tools. It runs as a plain local child process on the AUTHORITY (reached over ssh from here), so it
# needs no Python environment on her Mac and cannot be broken by anything installed locally.
#
# VERIFIED REACHABLE from this Mac before wiring: `ssh secratary-ts` answers, and the server file and
# its interpreter both exist on the far side. It is gated to non-Windows because her *laptop* has no
# route to the authority at all (its Tailscale is logged out and the two sites are separate networks);
# a row that cannot start would only add noise there. The laptop reads the company through
# scripts/ps-system.mjs over HTTPS instead, which works from anywhere.
#
# `failOnStartupError: false` is deliberate: if the tunnel to the authority is down, her assistant must
# still work on everything local rather than refusing to mount.
- id: mcp-secretary
  name: '@deepseek-ai/dsh-mcp-client'
  disabled: !!js process.platform === 'win32'
  config:
    serverName: secretary
    transport: stdio
    command: ssh
    args:
      - '-T'
      - '-o'
      - 'BatchMode=yes'
      - '-o'
      - 'LogLevel=ERROR'
      - '-o'
      - 'ConnectTimeout=10'
      - '-o'
      - 'ServerAliveInterval=30'
      - '-o'
      - 'ServerAliveCountMax=3'
      - 'secratary-ts'
      - '/home/zabz/personal-secretary-mvp/.venv/bin/python'
      - '/home/zabz/personal-secretary-mvp/scripts/ps_mcp_server.py'
    toolCallTimeoutMs: 120000
    failOnStartupError: false