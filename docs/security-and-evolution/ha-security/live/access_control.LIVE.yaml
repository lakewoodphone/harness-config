    # FIRM reminder
    - delay:
        seconds: >-
          {{ states('input_number.phoenix_interior_door_nag_firm_delay_seconds') | int(60) }}
    - condition: state
      entity_id: binary_sensor.phoenix_control_room_interior_door_contact
      state: 'on'
    
    # CRITICAL reminder (repeating)
# ------------------------------------------------------------------------------
# INTERIOR MAGLOCK TAMPER PROTECTION
# Automatically re-locks interior maglock if manually toggled + sends alert
# ------------------------------------------------------------------------------
- id: phoenix_interior_maglock_tamper_restore
  alias: Phoenix - Interior Maglock Tamper Restore
  description: Automatically re-locks interior maglock if someone manually turns it off, and sends alert to owner.
  initial_state: true
  mode: restart
  trigger:
  - platform: state
    entity_id: switch.smart_switch_l4
    to: 'off'
  condition:
  - condition: state
    entity_id: input_boolean.phoenix_access_control_enabled
    state: 'on'
  # Don't treat a deliberate buzz-in (unlock window) as tamper.
  - condition: state
    entity_id: timer.phoenix_interior_maglock_buzz_window
    state: 'idle'
  action:
  - service: switch.turn_on
    target:
      entity_id: switch.smart_switch_l4
  - service: logbook.log
    data:
      name: Security Alert
      message: Interior maglock manually tampered - automatically restored to LOCKED
      entity_id: switch.smart_switch_l4
  - service: persistent_notification.create
    data:
      title: "ΓÜá∩╕Å Interior Maglock Tamper"
      message: >-
        Interior maglock was manually toggled OFF at {{ now().strftime('%I:%M %p') }}.
        Automatically restored to LOCKED state.
      notification_id: interior_maglock_tamper
  - service: input_text.set_value
    target:
      entity_id: input_text.phoenix_door_activity_log
    data:
      value: >-
        {{ (now().strftime('%b %d, %-I:%M %p') ~ ' - ΓÜá∩╕Å INTERIOR MAGLOCK TAMPER - Restored to locked\n' ~ states('input_text.phoenix_door_activity_log'))[:255] }}

# ADDED 2026-10-18 - INTERIM MITIGATION, pending the owner's decision on the real rule (#720).
#
# MEASURED: input_boolean.phoenix_house_guest_mode_active is switched ON by three credential
# scenarios in this very file (parent PIN :241, house-access PIN :433, Yitz PIN :477) and
# switched OFF by nothing anywhere. It is the third term of
# binary_sensor.phoenix_everyone_away, so while it is on the alarm CANNOT arm. A parent entry at
# 2026-10-18 02:01 left the shop disarmed for twenty hours, through a full business day and
# after closing, and nobody noticed.
#
# This does not decide what guest mode should mean. It guarantees an empty shop is armed again
# every night whatever credential was used that day, which is the property whose absence caused
# those twenty hours.
#
# Safe against the obvious risk: while nobody is present the only alarm inputs are the three
# door contacts and the two zones. A tenant entering the apartment at night uses the deadbolt,
# which has no contact sensor and cannot trigger it.
- id: phoenix_house_guest_mode_night_reset
  alias: "Phoenix - Arm at night when the shop is empty (guest mode reset)"
  mode: single
  trigger:
    - platform: time
      at: "23:00:00"
  condition:
    - condition: state
      entity_id: input_boolean.phoenix_user_is_here
      state: "off"
    - condition: state
      entity_id: input_boolean.phoenix_worker_is_here
      state: "off"
    - condition: state
      entity_id: input_boolean.phoenix_house_guest_mode_active
      state: "on"
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.phoenix_house_guest_mode_active
    - service: logbook.log
      data:
        name: Security
        message: "Guest mode reset at night with nobody present - alarm re-armed."

# ADDED 2026-10-19 for queue #720 (guest mode latch).
#
# The 2026-10-18 night reset above is a backstop, not a complete off path: it fires only at
# 23:00 and only if user/worker presence is already off. The original latch happened because
# the presence-follow automation looks at one instant (control room empty for 4 minutes) and
# its condition requires user_is_here/worker_is_here off AT THAT INSTANT. When a worker was
# still marked here at the four-minute mark, the condition failed and there was no retrigger
# when the worker later went off - so guest mode stayed on and everyone_away stayed off.
#
# This watchdog runs every minute, so it cannot miss that later transition. It clears guest
# mode only when the shop is genuinely empty: nobody marked here AND the control-room presence
# sensor has been off for at least four minutes. It does not arm while anyone is present.
- id: security_mode_house_guest_watchdog
  alias: "Security Mode - House Guest Empty Watchdog"
  mode: single
  trigger:
    - platform: time_pattern
      minutes: "/1"
  condition:
    - condition: state
      entity_id: input_boolean.phoenix_house_guest_mode_active
      state: "on"
    - condition: state
      entity_id: input_boolean.phoenix_user_is_here
      state: "off"
    - condition: state
      entity_id: input_boolean.phoenix_worker_is_here
      state: "off"
    - condition: template
      value_template: >-
        {{ is_state('binary_sensor.control_room_hub_control_room_presence', 'off')
           and (as_timestamp(now()) - as_timestamp(states.binary_sensor.control_room_hub_control_room_presence.last_changed)) >= 240 }}
  action:
    - service: input_boolean.turn_off
      target: { entity_id: input_boolean.phoenix_house_guest_mode_active }
    - service: input_select.select_option
      target: { entity_id: input_select.phoenix_security_mode }
      data: { option: Away }
    - service: logbook.log
      data:
        name: Security
        message: "Guest mode cleared by the empty-shop watchdog - alarm re-armed."
