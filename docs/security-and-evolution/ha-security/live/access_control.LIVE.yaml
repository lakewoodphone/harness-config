- id: deadbolt_pin_sync_and_activity_logger
  alias: Deadbolt - PIN Sync and Activity Logger
  mode: queued
  trigger:
  # 2026-10-25 (owner directive: one writer per slot): the pin-sync branch was
  # REMOVED from this automation. It used to trigger on
  # input_text.phoenix_admin_pin / input_text.phoenix_worker_pin and republish
  # slots 1 and 2 through script.ui_set_kwikset_pin. Slot 1 is owned by
  # phoenix-pin-rotation. Slot 2 was an unattributed legacy code and was cleared
  # the same night. What remains below is the ACTIVITY LOGGER ONLY: this
  # automation can no longer write any slot. See /config/apartment_deadbolt_codes.md.
  - platform: mqtt
    id: '1'
    topic: zigbee2mqtt/Apartment_Door_Smart_Lock
  action:
  - choose:
    - conditions:
      - condition: trigger
        id: '1'
      sequence:
      - variables:
          payload: '{{ trigger.payload_json }}'
          action: '{{ payload.get(''action'', ''unknown'') }}'
          source: '{{ payload.action_source_name }}'
          user_id: '{{ payload.action_user }}'
          user_name: '{% if user_id == 1 %} Boss {% elif user_id == 2 %} Worker {% elif user_id == 3 %} Guest {% elif user_id != null %} User {{ user_id }} {% else %} Unknown {% endif %}'
          logbook_message: "{% if source == 'keypad' %}Apartment Deadbolt unlocked by {{ user_name }}{% elif source == 'manual' %}Apartment Deadbolt {{ 'Locked' if action == 'manual_lock' else 'Unlocked' }} manually{% elif source == 'rf' %}Apartment Deadbolt operated by remote{% else %}Apartment Deadbolt state changed to {{ payload.lock_state }}{% endif %}"
          log_message: "{% if source == 'keypad' %}\n  Apartment Deadbolt Unlocked by {{ user_name }}\n{% elif source == 'manual' %}\n  Apartment Deadbolt {{ 'Locked' if action == 'manual_lock' else 'Unlocked' }} Manually\n{% elif source == 'rf' %}\n  Apartment Deadbolt Operated by Remote\n{% else %}\n  Apartment Deadbolt state changed to {{ payload.lock_state }}\n{% endif %}\n"
      - service: logbook.log
        data:
          name: Access Control
          message: '{{ logbook_message }}'
          entity_id: input_text.phoenix_access_control_log
      - service: input_text.set_value
        target: { entity_id: input_text.phoenix_door_activity_log }
        data:
          value: >-
            {{ (now().strftime('%b %d, %-I:%M %p') ~ ' - ' ~ log_message ~ '\n' ~ states('input_text.phoenix_door_activity_log'))[:255] }}

# ------------------------------------------------------------------------------
# DOOR RELAY STARTUP ASSERTION
# Ensure relays return to a secure default state after HA restarts.
# - Strike (fail-secure): OFF = locked
# - Maglocks (fail-safe): ON = locked
# ------------------------------------------------------------------------------
- id: phoenix_assert_door_relays_locked_on_start
  alias: Phoenix - Assert Door Relays Locked on Start
  description: Ensures strike/maglocks are returned to locked defaults after Home Assistant restarts.
  initial_state: true
  mode: single
  trigger:
    - platform: homeassistant
      event: start
  condition:
    - condition: state
      entity_id: input_boolean.phoenix_access_control_enabled
      state: 'on'
  action:
    - delay: '00:00:15'
    - choose:
        - conditions: "{{ states('switch.smart_switch_l1') not in ['unknown', 'unavailable'] }}"
          sequence:
            - service: switch.turn_off
              target:
                entity_id: switch.smart_switch_l1
    - choose:
        - conditions: "{{ states('switch.smart_switch_l2') not in ['unknown', 'unavailable'] }}"
          sequence:
            - service: switch.turn_on
              target:
                entity_id: switch.smart_switch_l2
    - choose:
        - conditions: "{{ states('switch.smart_switch_l4') not in ['unknown', 'unavailable'] }}"
          sequence:
            - service: switch.turn_on
              target:
                entity_id: switch.smart_switch_l4
    - service: logbook.log
      data:
        name: Security
        message: "Startup: asserted door relays to locked defaults (strike OFF, maglocks ON)."

# ------------------------------------------------------------------------------
# INTERIOR DOOR LEFT OPEN NAGGING
# Escalating urgency reminders via Alexa: gentle ΓåÆ firm ΓåÆ critical (repeating)
# ------------------------------------------------------------------------------
- id: phoenix_interior_door_left_open_nag
  alias: Phoenix - Interior Door Left Open Nagging
  description: Nag via Alexa with escalating urgency if interior door left open
  initial_state: false
  mode: restart
  trigger:
    - platform: state
      entity_id: binary_sensor.phoenix_control_room_interior_door_contact
      to: 'on'
  condition:
    - condition: state
      entity_id: input_boolean.phoenix_access_control_enabled
      state: 'on'
  action:
    # Initial grace period
    - delay:
        seconds: >-
          {{ states('input_number.phoenix_interior_door_nag_grace_seconds') | int(10) }}
    - condition: state
      entity_id: binary_sensor.phoenix_control_room_interior_door_contact
