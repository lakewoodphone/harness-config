# Re-assert the phone engine's two install-layout invariants before every start.
#
# WHY A DROP-IN AND NOT THE UNIT. The unit file is regenerated from harness-config
# on redeploy; a drop-in is additive and survives that. What it asserts is
# documented in /usr/local/bin/repair-phone-engine.sh:
#
#   * @deepseek-ai/dsh-scope resolves to ONE file across the engine tree and the
#     profile tree. Two copies live in one process on the 2026-10-12 cloud
#     migration; the agent loop stamped the agent's context with one copy's
#     Symbol("dsh.scope") while dsh-client-file-upload read the other's, so
#     scopeOf(agent.ctx) was undefined and every prompt was rejected as
#     session/agent-busy — "the phone can't send a message" on every device.
#
#   * the phone layer assets are deployed where phone-gate.py looks for them.
#     Absent, /dsh-phone-mobile.css 404s and the whole mobile layout is gone:
#     no drawer, no 44px controls, no safe-area insets.
#
# `--check` never writes: it fails the start rather than repairing silently, so a
# recurrence shows up in `systemctl status phone-engine` and not on the phone.
[Service]
ExecStartPre=/usr/local/bin/repair-phone-engine.sh --check
