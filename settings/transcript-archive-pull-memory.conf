# Keep ONE runaway archive pass from OOM-killing the whole host.
#
# WHY. Measured on secratary-cloud 2026-10-12: this unit reached 7.4 GB RSS
# (total-vm 9.2 GB) on a 15 GiB box. The kernel's oom-killer fires GLOBALLY, and
# company-api, the phone engine, cloudflared and the mesh broker all live on the
# same host — so one archive pass takes the whole company with it. In the 24 hours
# before the 13:13 hard reset this unit was the oom-kill victim four times
# (08:43, 09:33, 11:30, 12:33) and company-api three times (07:52, 09:05, 15:17).
# The previous boot's journal simply stops at 13:09:02 and the next boot starts at
# 13:13:08 with no shutdown sequence — an unclean reset while the box was thrashing.
#
# WHAT THIS DOES. The job is killed on its own, by cgroup, instead of the kernel
# choosing a victim across the machine. A bounded failure is survivable; a global
# oom-kill that takes cloudflared and the API down is not.
#
# CEILING CHOICE. 3.5 GB is BELOW what the process needs today, so the pass will
# fail fast rather than thrash — deliberate, and it is why the limit must be raised
# once the pull's own footprint is understood. The pull re-runs hourly and resumes
# from its manifest, so nothing is lost by a killed pass.
[Service]
MemoryMax=3500M
MemorySwapMax=512M
