# Give ONE archive pass a ceiling that it can actually work under, while keeping
# it from taking the company down with it.
#
# MEASURED on secratary-cloud, 2026-10-12 (15 GiB RAM, 4 GiB swap):
#   * company-api          ~1.7-3.3 GB resident, slow growth (it also reached 7.4 GB
#                          before an oom-kill earlier in the day).
#   * transcript-archive-pull  7.4 GB RSS on a pass with real work to do
#                          (total-vm 9.2 GB). That is the single largest allocation
#                          on the box, and it holds a whole pass in memory.
#   * the two together exceed the machine, and the kernel's oom-killer is GLOBAL:
#     company-api, the phone engine, cloudflared and the mesh broker are all on
#     this host, so the victim is chosen across all of them (14 kills in the 24h
#     before the 13:13 hard reset, which had no shutdown sequence in the journal).
#
# WHY 6 GB AND NOT 3.5 GB. The first version of this drop-in used 3.5 GB. It did
# protect the host — and it also killed three consecutive passes, because a pass
# with real work to do needs about twice that. A guard that stops the job from ever
# finishing is not a fix. 6 GB lets one pass run, and still guarantees the API ~5 GB
# of the 15 GiB and ~2 GB of headroom, which is the difference between a failed job
# and a rebooted company.
#
# MemoryMax kills the unit alone (cgroup), never the host. MemorySwapMax bounds how
# far it can push the swap file before that happens.
[Service]
MemoryMax=6G
MemorySwapMax=1G
