# Base harness settings -- identical on every machine.
#
# Merged with settings/machines/<hostname>.yaml, where the machine file wins.
# Keep secrets OUT of this file. Reference them by environment variable name
# (e.g. apiKeyEnv: DEEPINFRA_API_KEY), never by value.

ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1

# ---------------------------------------------------------------------------
# How this file reaches a machine (2026-09-11)
#
# `scripts/autosync.ps1` runs on both workstations from Task Scheduler
# (`PersonalSecretary-HarnessSync`, at logon and every 15 minutes). It
# fast-forwards the repo to origin, then applies THIS file and the presets into
# `~/.dsh` — from a snapshot of HEAD, not from the working tree.
#
# That distinction matters on a machine where several agent sessions hold files
# modified: applying the working tree would publish somebody's half-written
# preset, and refusing to apply would mean committed changes never arrive at all.
# The snapshot gives both properties — committed changes land, in-flight work is
# neither published nor lost. A dirty tree is reported in the run record.
# ---------------------------------------------------------------------------

ui-conversation:
  busyEnter: steer

permission:
  defaultPreset: danger-full-access

# ---------------------------------------------------------------------------
# Which model the owner is actually talking to.
#
# CORRECTED 2026-09-11 after the owner caught an error here. I had switched this
# to `deepseek-v4-pro` on the assumption that "pro" meant more capable. That was
# wrong, and it cost money for no gain.
#
# What the API actually says (probed, not assumed):
#   GET /models          -> deepseek-flash, deepseek-v4-pro
#   deepseek-v4.1-flash  -> REJECTED: "The supported API model names are
#                           deepseek-flash, deepseek-v4-pro"
#   identical prompt on deepseek-flash and deepseek-v4-pro returned byte-identical
#   usage (10/2 tokens, cache miss 10), i.e. no observable capability difference
#   on that probe.
#
# The owner's own understanding: 4.1 Flash is better AND cheaper than Pro. He
# knows this deployment; that belief beats my inference. `deepseek-flash` is the
# 4.1 Flash tier on this route. It is also what the account was already using
# before I touched it.
#
# Namespace and schema: AGENT_DEFAULT_MODEL_SETTINGS_NAMESPACE in
# @deepseek-ai/dsh-agent-default-model. Selection resolves per request, so a
# change applies without restarting the process.
#
# LESSON (see journal/LESSONS.md L25): do not change the owner's model on
# inference. Probe it, price it, and ask if it is his money.
# ---------------------------------------------------------------------------
agent-default-model:
  provider: deepseek-official
  model: deepseek-flash

agent-presets:
  # `zabz` is the conversational CEO: full toolbelt, the secretary bridge, and a
  # persona written from the measured analysis of 23,035 owner turns. This is the
  # thing that replaces Copilot chat.
  #
  # It derives from `cordis-bg`, which carries the background-first shell policy
  # (long commands start as background jobs instead of dying at the 120s
  # foreground timeout). That policy is retained, so both presets are safe.
  #
  # Set 2026-09-11 after mount validation returned "mounted OK: zabz".
  # NOTE: this is read when a session starts, so a running process keeps its old
  # preset until restarted.
  default: zabz

# ---------------------------------------------------------------------------
# Fail-fast model behaviour (added 2026-09-14, after the DeepSeek flash outage).
#
# `streamIdleTimeoutMs` ships at 300000 (five minutes). In that outage a request
# sat the full five minutes and then retried -- which is exactly what "nothing
# would go when I type a question" felt like. 60 s bounds ONE dead attempt and
# still clears DeepSeek's slowest observed first-token latency. `retryPolicy`
# normal/2 keeps one transient-blip recovery without turning a dead provider
# into a multi-minute stall. Both schemas were read out of the installed harness
# (dsh-llm RetryPolicySchema, dsh-llm-deepseek adapter options) before writing.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Per-request output bound (added 2026-10-02, housekeeping item 342).
#
# The adapter ships DEFAULT_MAX_TOKENS = 256000
# (dsh-llm-deepseek/lib/index.js:1394) and this fleet had never set it, so every
# model request inherited a 256k-token output ceiling -- a cap so high it bounds
# nothing. `maxTokens` is the adapter's only per-request bound that reaches the
# wire, and the path is proven from the installed code:
#   settings llm-deepseek.maxTokens
#     -> connection.maxTokens            (dsh-llm-deepseek/lib/index.js:1998)
#     -> defaultMaxTokens                (dsh-llm-deepseek/lib/index.js:1589)
#     -> per-request maxTokens           (dsh-llm/lib/index.js:2112-2114)
#     -> `max_tokens` on the request     (dsh-llm-deepseek/lib/index.js:246)
# 65536 is 4x tighter than the shipped default and still above any single
# response this fleet has produced (the largest COMPLETE shift output ever
# recorded is ~510 KB of stdout, and that is the sum of every call in the run,
# not one call). Hitting the bound is recoverable -- the agent loop continues --
# whereas the 256k default lets one call run effectively unbounded.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Why MALFORMED_RESPONSE is in this list (added 2026-10-05)
#
# The DeepSeek Messages adapter validates every tool-call block at `message_stop`
# with a bare `JSON.parse` and reports a failure as MALFORMED_RESPONSE, which by
# default is NOT retryable -- so one malformed tool call ends the whole turn and
# every tool call in it is discarded. Measured over 30 days of this machine's own
# session ledger: 86 malformed tool-call argument sets, across `write`, `edit`,
# `send_message`, `read`, `pwsh`, `web_search`, `subagent` and the MCP tools.
# The model recovers on its own when asked again, so one retry costs a model
# round-trip and saves the turn.
#
# This is the second layer. The first is
# `scripts/patch-dsh-malformed-tool-input.py`, which repairs the argument JSON in
# the adapter (34 of those 86 cases are one missing quote or brace) and turns the
# rest into a tool result the model can read, so the retry rarely has to happen.
# ---------------------------------------------------------------------------
llm-deepseek:
  streamIdleTimeoutMs: 60000
  maxTokens: 65536
  retryPolicy:
    mode: normal
    maxRetries: 2
    retryableCodes: [EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT, STREAM_CLOSED, MALFORMED_RESPONSE]
    backoff:
      initialDelayMs: 500
      maxDelayMs: 5000
      jitterRatio: 0.1

# ---------------------------------------------------------------------------
# The third failover tier, on infrastructure independent of api.deepseek.com.
# No secret is inlined: `apiKeyEnv` names a ref each machine supplies in
# ~/.dsh/.credentials.yaml. Machine files may narrow `models`; their array
# replaces this one (scripts/merge-settings.mjs deep-merges, arrays replace).
# ---------------------------------------------------------------------------
llm-pi-ai:
  providers:
    deepinfra:
      apiKeyEnv: DEEPINFRA_API_KEY
      api: openai-completions
      baseURL: https://api.deepinfra.com/v1/openai
      models:
        - id: deepseek-ai/DeepSeek-V4-Flash-0731
          name: DeepSeek V4 Flash (0731)
        - id: deepseek-ai/DeepSeek-V4.1-Flash
          name: DeepSeek V4.1 Flash

# ---------------------------------------------------------------------------
# DSH daily spend ceiling and per-machine concurrency cap.
#
# Added 2026-09-17 for journal pain P209 ("no budget, ceiling or alert of any
# kind guards DSH spend") — until today there was none, and this block is the
# shared, synced form of the policy. The guard is
# packages/plugin-cost/src/guard.mjs, mounted by the `spend-guard` row in
# packages/plugin-cost/cordis.patch.yml, which registers this as the
# `spend-guard` settings namespace. Machine files override any key.
#
# WHY THESE NUMBERS, and every one of them is measured rather than chosen:
#
#   $35 warn        Above the median day ($4-7) and above every legitimate
#                   single-machine day on record ($35.39, ZABZ-YOGA 09-14), so a
#                   normal day never sees it.
#   $80 stop fan-out  ~70 minutes of a 55-agent fleet at the measured $68/hour
#                   (docs/mesh/96-gateway-at-scale.md §4.1). Long enough to
#                   notice a fan-out going wrong and finish it.
#   $150 refuse      ~2.2 hours of that fleet, and 2.7x the worst day the owner
#                   has ever recorded ($54.92). The old $50 design was 44
#                   MINUTES of the same fleet — a tripwire laid across the
#                   situation it was invented to catch, and today's ordinary
#                   fleet had already spent $12.02 of it by lunchtime.
#   cap 12 agents    The wallet half is the money; this half protects the
#                   MACHINES. At 403 MiB commit and 0.62-1.68 logical CPUs per
#                   turn (docs/mesh/84-calibration.md) a laptop degrades near 14
#                   turns regardless of money, and the fleet's own historical
#                   peak is 16-22 requests in flight. 12 matches the measured
#                   machine ceiling and the measured peak.
#
# onInternalError: closed is the money-critical default: if the guard itself
# fails, the step is REFUSED rather than allowed. The company's llm_budget.py
# fails OPEN on unexpected error (llm_budget.py:428-432, recorded in P209) and
# that defect is deliberately not repeated here.
# ---------------------------------------------------------------------------
spend-guard:
  warnUsd: 35
  fanoutUsd: 80
  ceilingUsd: 150
  concurrencyCap: 12
  onInternalError: closed

