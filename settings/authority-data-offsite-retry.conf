# REPO ARTIFACT for the drop-in installed as
#   /etc/systemd/system/authority-data-offsite.service.d/10-retry-transient.conf
# on secratary-cloud (installed 2026-10-16T21:02Z, `systemctl daemon-reload` rc=0).
#
# 2026-10-16 — A TRANSIENT DISK BLIP MUST NOT COST A DAY
#
# Measured: on 2026-10-16 the unit ran at 06:39:28Z and exited 3 in THE SAME SECOND —
#   FATAL: only 1582332 KiB free under /var/tmp; refusing to start
# 1.5 GiB free then, 26.6 GiB by 20:40. The guard was RIGHT; the schedule was wrong.
# `Restart=no` (the systemd default) plus a daily timer turned one transient refusal into
# 14 h with no offsite copy of /opt/company/data, and the unit sat in `systemctl --failed`
# the whole time. Before this drop-in: `systemctl show authority-data-offsite.service -p
# Restart` read `Restart=no`, `OnFailure=` was empty, and no drop-in existed.
#
# WHY RestartSec=900: the spike clears on the cadence of the jobs that cause it — disk-guard
# and tmpfs-reaper run every 15/20 min, and the database backup that shares the filesystem
# finished at 05:56. Fifteen minutes gives the consumer that filled /var/tmp time to release
# it, and a healthy run of this job takes ~12 min, so attempts do not overlap.
#
# WHY IT CANNOT HAMMER A FULL DISK: the retry re-enters authority-data-offsite.sh's OWN
# guard, which refuses to start below 6 GiB free under /var/tmp BEFORE it stages anything
# (script lines 45-49). The refusal costs one `df` and one log line. The thing that protects
# the disk from this job is the guard, so retrying is safe precisely because the guard is
# what we retry into — and the job's ~4 GB staging tar is never created while it is refusing.
#
# WHY BOUNDED: StartLimitBurst=5 within StartLimitIntervalSec=3h means at most five starts
# (T, +15, +30, +45, +60 min) and then systemd stops and holds the unit FAILED. Without an
# explicit StartLimitIntervalSec the default is 10 s, at a 15-minute interval the rate limiter
# would NEVER trip, and the retry would be unbounded rather than bounded. A terminal `failed`
# state is also the signal authority-deadman.py now reads via `systemctl is-failed`, which
# takes the EXTERNAL healthchecks.io switch down and emails the owner.
#
# Read back after install (2026-10-16T21:03Z):
#   Restart=on-failure   RestartUSec=15min   StartLimitIntervalUSec=3h   StartLimitBurst=5
#
# VERIFIED EMPIRICALLY on a throwaway Type=oneshot unit on the same host (systemd 259):
#   NRestarts=3, three real re-executions 4 s apart, then
#   "zz-retry-probe.service: Start request repeated too quickly" -> Result=exit-code.
#   So `Restart=on-failure` IS honoured for Type=oneshot here, and the start limit DOES stop it.
[Unit]
StartLimitIntervalSec=3h
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=900
